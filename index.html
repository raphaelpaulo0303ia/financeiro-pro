<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Vídeos | Raphael Designer</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #ff6a00;
            --primary-hover: #e65c00;
            --dark-bg: #0f0f11;
            --card-bg: #18181c;
            --card-secondary: #222227;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c34;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TELA DE AUTENTICAÇÃO */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
        }

        .login-box {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-box h2 {
            font-size: 20px;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .login-box input {
            width: 100%;
            padding: 12px 14px;
            background: var(--card-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            margin-bottom: 16px;
            font-size: 14px;
            outline: none;
        }

        .login-box input:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* ESTRUTURA PRINCIPAL */
        #main-system {
            display: none;
            width: 100%;
            max-width: 1100px;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-sair {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        /* LISTA HORIZONTAL DOS MESES */
        .meses-carousel {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 24px;
            scrollbar-width: thin;
        }

        .mes-item {
            flex: 0 0 130px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .mes-item.active {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(255, 106, 0, 0.2);
        }

        .mes-item .nome-mes {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        .mes-item .valor-mes {
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
        }

        /* PAINEL DE LANÇAMENTO */
        .card-lancamento {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .card-lancamento h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 100px 140px;
            gap: 12px;
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--card-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        /* TABELA DE REGISTOS */
        .table-responsive {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        thead {
            background-color: var(--card-secondary);
        }

        th {
            padding: 14px 16px;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .col-qtd {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-qtd {
            background: var(--card-secondary);
            border: 1px solid var(--border-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .status-badge {
            background: rgba(255, 106, 0, 0.15);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .btn-del {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-del:hover {
            background: var(--danger);
            color: #fff;
        }

        /* SUMÁRIO FINAL */
        .summary-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px 24px;
            border-radius: 10px;
        }

        .summary-info {
            display: flex;
            gap: 30px;
        }

        .summary-info .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .summary-info .val {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        .btn-pdf {
            background: var(--primary);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- ECRÃ DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Acesso Restrito</h2>
            <input type="password" id="input-senha" placeholder="Digite a chave de acesso">
            <button class="btn-primary" onclick="autenticar()">Entrar</button>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="main-system">
        <div class="top-bar">
            <div>
                <h1 style="font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px;">Painel de Controlo</h1>
                <p id="user-role" style="font-size: 12px; color: var(--text-muted);">Administrador</p>
            </div>
            <button class="btn-sair" onclick="sair()">Terminar Sessão</button>
        </div>

        <!-- LISTA DOS MESES -->
        <div class="meses-carousel" id="lista-meses"></div>

        <!-- FORMULÁRIO DE LANÇAMENTO (APENAS ADMIN) -->
        <div class="card-lancamento admin-only" id="form-novo-video">
            <h3 id="form-title">Lançar Novo Vídeo</h3>
            <div class="form-row">
                <div class="input-group">
                    <label>Nome do Vídeo / Cliente</label>
                    <input type="text" id="desc-video" placeholder="Ex: TED PAGODEIRO 01/02">
                </div>
                <div class="input-group">
                    <label>R$ Unitário</label>
                    <input type="number" id="valor-unit" step="0.01" placeholder="50.00">
                </div>
                <div class="input-group">
                    <label>Qtd</label>
                    <input type="number" id="qtd-video" value="1" min="1">
                </div>
                <div class="input-group">
                    <label>Status</label>
                    <select id="status-video">
                        <option value="Pendente">Pendente</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="gravarItem()">Adicionar à Lista</button>
        </div>

        <!-- TABELA DE VÍDEOS -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Valor Unit.</th>
                        <th style="text-align: center;">Qtd</th>
                        <th>Subtotal</th>
                        <th>Status</th>
                        <th class="col-admin" style="text-align: center;">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-itens">
                    <!-- Registos carregados via JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- SUMÁRIO -->
        <div class="summary-card">
            <div class="summary-info">
                <div>
                    <div class="label">Total Trabalhado</div>
                    <div class="val" id="total-geral">R$ 0,00</div>
                </div>
            </div>
            <button class="btn-pdf" onclick="window.print()">Gerar PDF</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SEU FIREBASE
        const firebaseConfig = {
            databaseURL: "https://financeiro-videos-raphael-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // CONTROLO DE SESSÃO E MESES
        const PASS_ADMIN = "MIGUEL22012019";
        const PASS_VIEWER = "ARTECIA";
        let perfilAtual = null;
        let mesSelecionado = "Setembro";

        const listaMeses = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        function autenticar() {
            const senha = document.getElementById("input-senha").value.trim();
            if (senha === PASS_ADMIN) {
                perfilAtual = "admin";
            } else if (senha === PASS_VIEWER) {
                perfilAtual = "viewer";
            } else {
                alert("Chave de acesso incorreta.");
                return;
            }

            document.getElementById("login-screen").style.display = "none";
            document.getElementById("main-system").style.display = "block";
            document.getElementById("user-role").textContent = perfilAtual === "admin" ? "Acesso Total (Administrador)" : "Acesso Parceria (Apenas Leitura)";

            // Ocultar formulário de lançamento para o perfil de leitura
            if (perfilAtual === "viewer") {
                document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
            }

            montarCarrosselMeses();
            carregarDadosMes(mesSelecionado);
        }

        function sair() {
            perfilAtual = null;
            document.getElementById("input-senha").value = "";
            document.getElementById("main-system").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
        }

        function montarCarrosselMeses() {
            const container = document.getElementById("lista-meses");
            container.innerHTML = "";

            listaMeses.forEach(mes => {
                const item = document.createElement("div");
                item.className = `mes-item ${mes === mesSelecionado ? "active" : ""}`;
                item.onclick = () => selecionarMes(mes);
                item.innerHTML = `
                    <span class="nome-mes">Mês de</span>
                    <strong style="font-size: 13px; display: block; margin-bottom: 4px;">${mes}</strong>
                    <span class="valor-mes" id="resumo-${mes}">R$ 0,00</span>
                `;
                container.appendChild(item);
                escutarTotalMes(mes);
            });
        }

        function selecionarMes(mes) {
            mesSelecionado = mes;
            document.querySelectorAll(".mes-item").forEach(el => el.classList.remove("active"));
            montarCarrosselMeses();
            document.getElementById("form-title").innerText = `Lançar Novo Vídeo – ${mes}`;
            carregarDadosMes(mes);
        }

        // CARREGAMENTO DOS REGISTOS EM TEMPO REAL
        function carregarDadosMes(mes) {
            database.ref(`financeiro/${mes}`).on("value", snapshot => {
                const tbody = document.getElementById("tabela-itens");
                tbody.innerHTML = "";
                let totalGeral = 0;

                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const id = child.key;
                        const data = child.val();
                        const subtotal = Number(data.valor) * Number(data.qtd);
                        totalGeral += subtotal;

                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td><strong>${data.descricao}</strong></td>
                            <td>R$ ${Number(data.valor).toFixed(2)}</td>
                            <td style="text-align: center;">
                                <div class="col-qtd" style="justify-content: center;">
                                    ${perfilAtual === "admin" ? `<button class="btn-qtd" onclick="ajustarQtd('${id}', -1,${data.qtd})">-</button>` : ""}
                                    <span>${data.qtd}</span>
                                    ${perfilAtual === "admin" ? `<button class="btn-qtd" onclick="ajustarQtd('${id}', 1,${data.qtd})">+</button>` : ""}
                                </div>
                            </td>
                            <td><strong>R$ ${subtotal.toFixed(2)}</strong></td>
                            <td><span class="status-badge">${data.status || "Pendente"}</span></td>
                            <td class="col-admin" style="text-align: center;">
                                <button class="btn-del" onclick="excluirRegisto('${id}')" title="Eliminar lançamento">✕</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Nenhum registo lançado neste mês.</td></tr>`;
                }

                document.getElementById("total-geral").textContent = `R$ ${totalGeral.toFixed(2)}`;

                // Ocultar coluna de ações se for perfil visualizador
                if (perfilAtual === "viewer") {
                    document.querySelectorAll(".col-admin").forEach(el => el.style.display = "none");
                }
            });
        }

        function escutarTotalMes(mes) {
            database.ref(`financeiro/${mes}`).on("value", snapshot => {
                let total = 0;
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const data = child.val();
                        total += Number(data.valor) * Number(data.qtd);
                    });
                }
                const label = document.getElementById(`resumo-${mes}`);
                if (label) label.textContent = `R$ ${total.toFixed(2)}`;
            });
        }

        // OPERAÇÕES DO BANCO DE DADOS
        function gravarItem() {
            const desc = document.getElementById("desc-video").value.trim();
            const valor = parseFloat(document.getElementById("valor-unit").value);
            const qtd = parseInt(document.getElementById("qtd-video").value) || 1;
            const status = document.getElementById("status-video").value;

            if (!desc || isNaN(valor)) {
                alert("Por favor, preencha o nome do vídeo e o valor corretamente.");
                return;
            }

            database.ref(`financeiro/${mesSelecionado}`).push({
                descricao: desc,
                valor: valor,
                qtd: qtd,
                status: status,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById("desc-video").value = "";
                document.getElementById("valor-unit").value = "";
                document.getElementById("qtd-video").value = "1";
            }).catch(err => {
                alert("Erro ao gravar: " + err.message);
            });
        }

        function ajustarQtd(id, delta, qtdAtual) {
            const novaQtd = qtdAtual + delta;
            if (novaQtd <= 0) {
                excluirRegisto(id);
            } else {
                database.ref(`financeiro/${mesSelecionado}/${id}`).update({ qtd: novaQtd });
            }
        }

        function excluirRegisto(id) {
            if (confirm("Tem a certeza de que pretende eliminar este lançamento?")) {
                database.ref(`financeiro/${mesSelecionado}/${id}`).remove()
                    .catch(err => {
                        alert("Erro ao eliminar: " + err.message);
                    });
            }
        }
    </script>
</body>
</html>
